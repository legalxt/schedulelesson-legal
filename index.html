<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Lesson</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://legalxt.github.io/schedulelesson/">
<script>
  // Старий лендинг переїхав на основний сайт — ведемо туди зі збереженням мови
  (function () {
    var BASE = 'https://legalxt.github.io/schedulelesson/';
    var PATHS = { uk: '', ru: 'ru.html', en: 'en.html' };
    var lang = '';
    try { lang = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase(); } catch (e) {}
    if (!PATHS.hasOwnProperty(lang)) {
      lang = (navigator.language || 'uk').slice(0, 2).toLowerCase();
      if (lang !== 'ru' && lang !== 'en') { lang = 'uk'; }
    }
    document.documentElement.lang = lang;
    var target = BASE + PATHS[lang];
    document.addEventListener('DOMContentLoaded', function () {
      var a = document.getElementById('go'); if (a) { a.href = target; }
    });
    location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://legalxt.github.io/schedulelesson/">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    background: #faf9fd; color: #1c1830; text-align: center; line-height: 1.6; }
  a { color: #6d45d8; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #14111f; color: #f0eff6; } a { color: #b9a6f7; } }
</style>
</head>
<body>
  <p>Schedule Lesson → <a id="go" href="https://legalxt.github.io/schedulelesson/">legalxt.github.io/schedulelesson</a></p>
</body>
</html>
